<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BROZER Visual Grounding Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8fafc; color: #0f172a; }
    .card { background: white; padding: 24px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    .btn-buy { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .nav-link { color: #2563eb; text-decoration: none; margin-bottom: 16px; display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <a id="nav-link" class="nav-link" href="#details">← Navigation: Product Details</a>
    <h2>Checkout & Login</h2>
    <p id="ordinary-text">Welcome to the local shop. Please sign in to purchase items securely.</p>
    
    <div class="form-group">
      <label for="email-input">Email Address</label>
      <input id="email-input" type="email" value="alice@example.com" placeholder="Enter email">
    </div>

    <div class="form-group">
      <label for="password-input">Password</label>
      <input id="password-input" type="password" value="SuperSecret123" placeholder="Enter password">
    </div>

    <div class="form-group">
      <label for="card-input">Credit Card</label>
      <input id="card-input" type="text" value="4111 1111 1111 1111" placeholder="Card number">
    </div>

    <button id="buy-now-btn" class="btn-buy">Buy Now</button>

    <div id="product-details" style="margin-top:24px; border-top:1px solid #e2e8f0; padding-top:16px;">
      <h3>Product Details</h3>
      <p>High performance local privacy browser engine.</p>
      <img id="product-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Product Image" width="100" height="100">
    </div>
  </div>
</body>
</html>
